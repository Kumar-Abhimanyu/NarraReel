[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "narrareel"
version = "0.1.0.dev0"
description = "Turn your script into a Reel, Short or YouTube video - free AI voices or your own cloned voice, exact duration, viral-style captions. Local and open source."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "SanTiwari07 and NarraReel contributors" }]
keywords = ["text-to-speech", "tts", "captions", "reels", "shorts", "video", "voice-cloning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "edge-tts>=7.2",
    "fonttools>=4.50",
    "numpy>=1.24",
    "pillow>=10",
    "pydantic>=2.6",
    "typer>=0.12",
]

[project.optional-dependencies]
offline = ["kokoro-onnx>=0.6"]
align = ["faster-whisper>=1.1"]
# setuptools<81: resemble-perth (a Chatterbox dependency) imports pkg_resources, which newer setuptools dropped
clone = ["chatterbox-tts>=0.1.7", "setuptools<81"]
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sse-starlette>=2",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
    "pip-licenses",
    "httpx>=0.27",
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
    "sse-starlette>=2",
    "jsonschema>=4",
]

[project.urls]
Homepage = "https://github.com/SanTiwari07/NarraReel"
Repository = "https://github.com/SanTiwari07/NarraReel"
Issues = "https://github.com/SanTiwari07/NarraReel/issues"

[project.scripts]
narrareel = "narrareel.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["narrareel"]
# the built web app is git-ignored but must ship in the wheel
artifacts = ["narrareel/server/static/**"]

[tool.hatch.build.targets.sdist]
include = ["narrareel", "README.md", "LICENSE", "THIRD_PARTY_LICENSES.md"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["frontend", "venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501"]  # B008: typer defaults; E501: long user-facing messages

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: needs internet (Edge TTS)",
    "ffmpeg: needs ffmpeg/ffprobe on PATH",
    "slow: slow test",
    "models: needs downloaded ML models / optional extras",
]
addopts = "-ra"
